[project]
name = "multi_agent_information_management_system_with_crew_supervision"
version = "0.1.0"
description = "multi_agent_information_management_system_with_crew_supervision using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[bedrock,file-processing,litellm,tools]==1.14.4",
]

[project.scripts]
multi_agent_information_management_system_with_crew_supervision = "multi_agent_information_management_system_with_crew_supervision.main:run"
run_crew = "multi_agent_information_management_system_with_crew_supervision.main:run"
train = "multi_agent_information_management_system_with_crew_supervision.main:train"
replay = "multi_agent_information_management_system_with_crew_supervision.main:replay"
test = "multi_agent_information_management_system_with_crew_supervision.main:test"
run_with_trigger = "multi_agent_information_management_system_with_crew_supervision.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]

[tool.vercel]
entrypoint = "backend.api:app"

